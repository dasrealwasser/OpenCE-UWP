name: Sync Upstream

# Automatically checks for updates from the upstream repository
# (OpenCommunityEdition/OpenCE), merges them into this fork, and pushes to main.
# Any new commits pushed to main will automatically trigger the Build workflow,
# creating fresh UWP .msix packages and publishing a new release for the in-app updater.

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream OpenCE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          echo "Adding upstream remote..."
          git remote add upstream https://github.com/OpenCommunityEdition/OpenCE.git || git remote set-url upstream https://github.com/OpenCommunityEdition/OpenCE.git
          git fetch upstream main

          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "Upstream main: $UPSTREAM_HEAD"
          echo "Local main:    $LOCAL_HEAD"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream OpenCE. Nothing to do."
            exit 0
          fi

          echo "Merging upstream/main into main..."
          if git merge upstream/main -m "Merge upstream OpenCommunityEdition/OpenCE main into fork" --no-edit; then
            echo "Pushing merged changes to origin..."
            git push origin main
            echo "Successfully synced and pushed upstream updates."
          else
            echo "::error::Merge conflict detected between upstream and fork. Please resolve conflicts manually."
            exit 1
          fi
